# simulator/config.example.yaml — annotated example.
#
# Copy this file to `simulator/config.yaml` (gitignored by default) and tune
# for your run. The loader in `simulator/config.py` enforces:
#   - every top-level key below is required (no silent defaults)
#   - unknown keys raise (catches typos like `pump_cont: 15`)
#   - types are checked strictly (booleans are NOT integers, integers are
#     NOT floats, etc.)
#   - broker.tls is required iff broker.target is 'aws-iot' and forbidden iff
#     broker.target is 'local' (see the broker section below)
#
# Run `python -c "from simulator.config import load_config; print(load_config('simulator/config.yaml'))"`
# to sanity-check after edits, or `python -m simulator --config simulator/config.yaml`
# to start the fleet (per the mqtt-publishing session 2026-05-25).

fleet:
  # Number of pumps in the simulated fleet. PLAN.md targets ~15.
  # Range [1, 100]. Above ~30 starts to stress single-PC local mode; the
  # cap exists to catch typos (pump_count: 1500), not to enforce physics.
  pump_count: 15

  # Nominal RPM each pump targets when HEALTHY. Real-world centrifugal
  # pumps run 1750-3500 RPM; 1800 matches PLAN.md §2.2.
  # Range [1.0, 10000.0].
  setpoint_rpm: 1800.0

  # Ambient air temperature near the pump. Drives the baseline of
  # `bearing_temp = ambient + 0.02*rpm + ...` per ADR 0002.
  # Range [-50.0, 80.0]. 22.0 = comfortable indoor industrial floor.
  ambient_celsius: 22.0

  # Per-pump RNG seed is `base_seed + pump_index` (0-indexed). Change this
  # to get a different but reproducible run; leave at 0 for byte-identical
  # runs across machines.
  base_seed: 0

# Which demo scenario to drive the fleet with.
#
# Only `healthy` is wired today (mqtt-publishing session 2026-05-25). The
# other three are accepted at load time so demo manifests can be authored
# ahead of the scenario runner; trying to actually *run* them raises
# `NotImplementedError` at Fleet construction with a message pointing here.
#
# Allowed: healthy | seasonal_drift | fleet_expansion | real_failure
scenario: healthy

broker:
  # Where telemetry is published. Same Pump/Fleet code path either way
  # (per ADR 0003); the difference is which Publisher subclass instantiates
  # and whether the `tls:` block below is required.
  # Allowed: local | aws-iot
  target: local

  # URL is validated as a non-empty string but not parsed — the MQTT client
  # owns format validation (aiomqtt parses scheme/host/port). For `local`
  # this is the Mosquitto endpoint; for `aws-iot` this is the IoT Core
  # ATS endpoint (e.g. "<account>-ats.iot.eu-central-1.amazonaws.com").
  # The ATS endpoint is account-specific: after `terraform apply`, run
  # `terraform output -raw iot_endpoint` (from infra/) and paste it here.
  url: "mqtt://localhost:1883"

  # mTLS material — REQUIRED when target is 'aws-iot', FORBIDDEN when
  # target is 'local'. The loader checks the paths are non-empty strings
  # but does NOT touch disk; AwsIotPublisher does file-existence and SSL
  # context build at connect time (see ADR 0003 §Decision 5 + Addendum
  # 2026-05-27 "AwsIotPublisher wired").
  #
  # Per-pump identity (ADR 0016): the literal token `{pump_id}` is
  # expanded per pump by Fleet.from_config (plain string replace — not
  # str.format), so one tls block serves the whole fleet. Paths without
  # the token are used verbatim (the pre-ADR-0016 single-pump smoke
  # shape still works). `terraform apply` provisions the Things, certs,
  # and the shared policy AND writes the material into the gitignored
  # `simulator/.secrets/` layout below — see docs/runbooks/aws-demo-day.md.
  #
  # tls:
  #   cert_path: "simulator/.secrets/{pump_id}/{pump_id}.cert.pem"
  #   key_path:  "simulator/.secrets/{pump_id}/{pump_id}.private.key"
  #   ca_path:   "simulator/.secrets/AmazonRootCA1.pem"

# Compress HEALTHY dwell so a fresh clone exercises the full
# HEALTHY -> DEGRADING -> FAILING -> FAILED arc in a few minutes. Without
# this, HEALTHY dwell defaults to ~24h (43,200 ticks @ 2s/tick) which is
# realistic but recruiter-hostile. Effective HEALTHY dwell when true: 60
# ticks (~2 min). DEGRADING/FAILING/FAILED dwells are unaffected.
#
# Leave false for "realistic" runs; flip to true for demos.
demo_mode: false
