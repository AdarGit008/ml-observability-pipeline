# Grafana dashboard provisioning.
#
# Loads both dashboards (local + AWS mode) on startup so `docker compose up`
# renders dashboards without manual import.
#
# The `adapter_url` variable in the AWS dashboard JSON is set to a
# placeholder; replace it with the Terraform output `adapter_function_url`
# after `terraform apply`, or set it in the Infinity datasource URL field.

apiVersion: 1

providers:
  - name: 'ml-observability'
    orgId: 1
    folder: 'ML Observability'
    folderUid: 'ml-obs'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
